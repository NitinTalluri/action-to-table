# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json
id: prefect-client-in-router
message: This fixture will return an httpx client. Use FlowV3ServiceDep instead.
severity: warning # error, warning, info, hint
language: Python
rule:
  kind: type
  regex: PrefectV3ClientDep
  inside:
    kind: decorated_definition
    has:
      kind: decorator
      regex: router
    stopBy: end
note: This fixture will return an httpx client. Use FlowV3ServiceDep instead.
