# Using str(Enum.Member) does not return value as expected. This rule adds a __str__ method to Enum classes to return the value of the member.
id: add-str-method-to-enum
language: python
rule:
  pattern: $BODY
  kind: block
  not:
    has:
      kind: function_definition
      regex: __str__

  inside:
    kind: class_definition
    all:
      - has:
          kind: argument_list
          all:
            - has:
                kind: identifier
                pattern: str
            - has:
                kind: identifier
                pattern: Enum






transform:
  BODY_DUNDER:
    substring:
      source: $BODY

fix: |-
  $BODY_DUNDER

  def __str__(self) -> str:
      return str.__str__(self)
